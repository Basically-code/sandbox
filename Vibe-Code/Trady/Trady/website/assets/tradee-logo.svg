<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-labelledby="tradeeLogoTitle">
  <title id="tradeeLogoTitle">Tradee</title>
  <!--
    Tradee mark — "Route T"
    * The white crossbar is the marketplace: one bar shared by buyers (left) and sellers (right).
    * The saffron pin is the stem of the T: every trade ends in a delivery or a ride.
    * Royal blue to midnight navy squircle = trust; saffron = Tanzanian market energy.
  -->
  <defs>
    <linearGradient id="tdBg" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D6BFF"/>
      <stop offset="0.55" stop-color="#1F3FD1"/>
      <stop offset="1" stop-color="#0A1A3F"/>
    </linearGradient>
    <linearGradient id="tdPin" x1="24" y1="24" x2="40" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC15A"/>
      <stop offset="0.6" stop-color="#FF9F1C"/>
      <stop offset="1" stop-color="#F26A1B"/>
    </linearGradient>
    <linearGradient id="tdGloss" x1="32" y1="0" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#tdBg)"/>
  <rect width="64" height="64" rx="16" fill="url(#tdGloss)"/>
  <!-- Crossbar: the shared marketplace bar where buyers and sellers meet -->
  <rect x="11" y="12.5" width="42" height="11.5" rx="5.75" fill="#FFFFFF"/>
  <!-- Stem: the delivery pin that hangs from the bar to form the T -->
  <path d="M32 54C32 54 21.25 43.6 21.25 34.75A10.75 10.75 0 0 1 42.75 34.75C42.75 43.6 32 54 32 54Z" fill="url(#tdPin)"/>
  <circle cx="32" cy="34.75" r="4.1" fill="#13277A"/>
</svg>
