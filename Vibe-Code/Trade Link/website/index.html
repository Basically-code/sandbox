<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tradee (TradeLink) — eBay + Amazon Marketplace &amp; Bolt Transport Network</title>
  <link rel="icon" type="image/svg+xml" href="assets/tradee-logo.svg" />
  <link rel="stylesheet" href="styles/tradee.css" />
</head>
<body>
  <!-- 1. Sticky Daylight Top Navigation Header -->
  <header class="top-header">
    <div class="header-inner">
      <div class="brand-cluster" id="brand-home-link" title="Return to Tradee Marketplace Home">
        <div class="logo-squircle">
          <img src="assets/tradee-logo.jpg" alt="Tradee Professional Logo" onerror="this.src='assets/tradee-logo.svg'" />
        </div>
        <div class="brand-titles">
          <h1>Tradee · TradeLink</h1>
          <div class="brand-sub">Marketplace · Price Compare · Bolt Transport</div>
        </div>
      </div>

      <!-- 2. Global Search Bar -->
      <div class="global-search-pill">
        <input type="search" id="global-search-input" placeholder="Search Tradee products, sellers, categories or hubs..." aria-label="Search Tradee" />
        <div class="search-divider"></div>
        <span style="color:var(--brand-primary); font-weight:800;">🔍</span>
      </div>

      <!-- 3. Quick Action Header Buttons -->
      <div class="header-actions">
        <button class="pill-action-btn" id="header-compare-btn">
          <span>⚖️ Compare Prices</span>
        </button>
        <button class="pill-action-btn" id="header-cart-btn" title="View Shopping Cart &amp; Checkout">
          <span>🛒 Cart <strong id="header-cart-count">(0)</strong></span>
        </button>
        <button class="pill-action-btn primary-grad" id="header-bolt-btn">
          <span>🛵 Order Transport</span>
        </button>
      </div>
    </div>

    <!-- 4. Multi-Portal Switcher Bar -->
    <nav class="nav-tabs-bar" aria-label="Tradee Portals">
      <div class="nav-tabs-inner" id="portal-tabs-nav"></div>
    </nav>
  </header>

  <!-- 5. Dynamic Portal Workspace -->
  <main class="main-container" id="portal-workspace">
    <!-- Populated dynamically by js/app.js -->
  </main>

  <!-- 6. Bottom-Right Floating Live Map Button -->
  <button class="floating-map-btn" id="floating-map-btn" title="Open Live Courier Telemetry &amp; Verbal Safety Code">
    <span style="color:var(--brand-primary); font-size:20px;">🗺️</span>
    <span>MAP <small id="floating-map-count"></small></span>
  </button>

  <!-- 7. Toast Notification -->
  <div class="toast-banner" id="tradee-toast" style="display:none;"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
